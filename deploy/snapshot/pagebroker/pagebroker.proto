syntax = "proto2";
package snapshot.pagebroker;
option go_package = "github.com/ai-dynamo/dynamo/deploy/snapshot/internal/pagebroker";

message RestoreRequest
{
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_DIRECT = 1;
    MODE_STAGED = 2;
  }
  // Required. The existing checkpoint directory to restore.
  optional string source_path = 1;
  // Required. The PageBroker restore mode.
  optional Mode mode = 2;
  // Required for staged restore. Generated by Snapshot.
  optional string transaction_id = 3;
}
message PrepareCheckpointRequest
{
  // Required. The checkpoint directory to publish on commit.
  optional string destination_path = 1;
  // Required. Generated by Snapshot.
  optional string transaction_id = 2;
}
message CommitRequest
{
  // Required. A transaction generated by Snapshot.
  optional string transaction_id = 1;
}
message AbortRequest
{
  // Required. A transaction generated by Snapshot.
  optional string transaction_id = 1;
}
message Request
{
  oneof command
  {
    RestoreRequest restore = 1;
    PrepareCheckpointRequest prepare_checkpoint = 2;
    CommitRequest commit = 3;
    AbortRequest abort = 4;
  }
}

message RestoreResponse
{
  optional string directory_path = 1;
  optional string transaction_id = 2;
}
message PrepareCheckpointResponse
{
  optional string directory_path = 1;
  optional string transaction_id = 2;
}
message CommitResponse
{
  optional string directory_path = 1;
  optional string transaction_id = 2;
}
message AbortResponse
{
  optional string transaction_id = 1;
}
message ErrorResponse
{
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_INVALID_REQUEST = 1;
    CODE_NOT_FOUND = 2;
    CODE_CONFLICT = 3;
    CODE_RESOURCE_EXHAUSTED = 4;
    CODE_IO = 5;
    CODE_INTERNAL = 6;
  }
  optional Code code = 1;
  optional string message = 2;
}
message Response
{
  oneof outcome
  {
    RestoreResponse restore = 1;
    PrepareCheckpointResponse prepare_checkpoint = 2;
    CommitResponse commit = 3;
    AbortResponse abort = 4;
    ErrorResponse error = 5;
  }
}
